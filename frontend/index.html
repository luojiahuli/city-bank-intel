<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#070b14" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>中国中小银行关系图谱 · 华为机会视图</title>
  <meta name="description" content="全国银行业法人关系网络：区域、业务、IT投入、董监高与华为能力机会分析。" />
  <link rel="stylesheet" href="styles.css?v=20261111b" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">CB</span>
        <div>
          <h1>中国中小银行关系图谱</h1>
          <p>区域 · 业务 · IT 投入 · 董监高 · 华为机会</p>
        </div>
      </div>
      <div class="top-stats" id="topStats"></div>
      <div class="search-wrap">
        <input id="searchInput" type="search" placeholder="搜索银行名称 / 简称 / 城市" autocomplete="off" />
        <div class="search-results" id="searchResults"></div>
      </div>
      <button class="icon-btn mobile-only" id="filterBtn" title="筛选" aria-label="打开筛选">☰</button>
      <button class="icon-btn" id="fitBtn" title="重置视图">⤢</button>
    </header>

    <main class="workspace">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-scroll">
          <section class="side-section">
            <div class="side-title">筛选</div>
            <div class="filter-group" id="groupFilters"></div>
            <label class="field-label" for="provinceFilter">省份 / 区域</label>
            <select id="provinceFilter" class="select"></select>
            <label class="field-label" for="assetFilter">资产规模</label>
            <select id="assetFilter" class="select">
              <option value="">全部规模</option>
              <option value="万亿以上">万亿以上</option>
              <option value="5000-10000">5000–10000 亿</option>
              <option value="<5000">5000 亿以下（未细分）</option>
              <option value="1000-5000">1000–5000 亿</option>
              <option value="300-1000">300–1000 亿</option>
              <option value="300以下">300 亿以下</option>
              <option value="未披露">未披露</option>
            </select>
            <label class="field-label" for="profitFilter">盈亏状态</label>
            <select id="profitFilter" class="select">
              <option value="">全部</option>
              <option value="盈利">盈利</option>
              <option value="亏损">亏损</option>
              <option value="未披露">未披露</option>
            </select>
            <label class="field-label" for="penaltyFilter">处罚记录</label>
            <select id="penaltyFilter" class="select">
              <option value="">全部</option>
              <option value="yes">有处罚记录</option>
              <option value="collected">已采集（含零记录）</option>
              <option value="no">未采集</option>
            </select>
            <label class="field-label" for="oppFilter">华为机会分</label>
            <select id="oppFilter" class="select">
              <option value="0">不限</option>
              <option value="50">≥ 50</option>
              <option value="55">≥ 55</option>
              <option value="60">≥ 60</option>
            </select>
            <label class="check-row"><input type="checkbox" id="listedOnly" /> 仅看上市银行</label>
            <label class="check-row"><input type="checkbox" id="siteOnly" /> 仅看有官网画像</label>
            <label class="check-row"><input type="checkbox" id="allHuawei" /> 显示全部华为机会边</label>
            <button class="reset-btn" id="resetFilters">重置筛选</button>
          </section>

          <section class="side-section">
            <div class="side-title">数据覆盖</div>
            <div id="coverageBars" class="coverage"></div>
            <div class="side-note" id="dataNote"></div>
          </section>

          <section class="side-section">
            <div class="side-title">图例</div>
            <div class="legend-list" id="legendList"></div>
          </section>
        </div>
      </aside>
      <div class="drawer-backdrop" id="drawerBackdrop"></div>

      <section class="stage">
        <div class="view-tabs" id="viewTabs">
          <button class="view-tab active" data-view="region">区域</button>
          <button class="view-tab" data-view="business">主要业务</button>
          <button class="view-tab" data-view="focus">重点产业</button>
          <button class="view-tab" data-view="it">IT 投入</button>
          <button class="view-tab" data-view="huawei">华为机会</button>
          <button class="view-tab" data-view="governance">董监高</button>
          <button class="view-tab" data-view="similar">相似银行</button>
        </div>
        <canvas id="graphCanvas"></canvas>
        <div class="canvas-tooltip" id="tooltip"></div>
        <div class="canvas-hud" id="hud"></div>
        <div class="zoom-controls">
          <button id="zoomIn" title="放大">+</button>
          <button id="zoomOut" title="缩小">−</button>
          <button id="zoomFit" title="适应画布">⌂</button>
        </div>
        <div class="view-message" id="viewMessage"></div>
        <div class="loading-screen" id="loading">
          <div class="loading-inner">
            <div class="loading-ring"></div>
            <div class="loading-title">正在加载全国银行网络</div>
            <div class="loading-sub" id="loadingSub">读取机构名录与关系数据…</div>
          </div>
        </div>
      </section>

      <aside class="detail-panel collapsed" id="detailPanel">
        <button class="panel-toggle" id="panelToggle" title="收起/展开">◀</button>
        <div class="panel-head" id="panelHead">
          <div class="panel-kicker" id="panelKicker">节点详情</div>
          <h2 id="panelTitle">点击图中节点查看</h2>
          <div class="panel-sub" id="panelSub">银行画像、财务、新闻、处罚、董监高与华为机会</div>
          <div class="panel-badges" id="panelBadges"></div>
        </div>
        <div class="panel-tabs" id="panelTabs"></div>
        <div class="panel-body" id="panelBody">
          <div class="empty-state">点击任意银行或枢纽节点，查看多维详情。</div>
        </div>
      </aside>
    </main>

    <footer class="footer">
      <span id="footerNote">公开信息整理，不构成投资建议。</span>
      <span id="footerStamp"></span>
    </footer>
  </div>
  <div class="insight-modal" id="insightModal" role="dialog" aria-modal="true" aria-labelledby="insightTitle">
    <div class="insight-card">
      <header class="insight-head">
        <div>
          <div class="insight-kicker">城商行 · 量化结论</div>
          <h2 id="insightTitle">业务分布 · 华为机会 · 区域切入点</h2>
          <p class="insight-sub">基于 NFRA 名录 124 家城商行的公开披露数据，所有数字可回溯</p>
        </div>
        <div class="insight-head-right">
          <span class="insight-stamp" id="insightStamp"></span>
          <button class="ic-close" title="关闭" aria-label="关闭">✕</button>
        </div>
      </header>
      <div class="insight-body" id="insightBody"></div>
    </div>
  </div>

  <script src="d3.v7.min.js"></script>
  <button class="insight-btn" id="insightBtn" title="查看量化结论分析" aria-label="打开量化结论分析">
    <span class="insight-btn-dot"></span><span class="insight-btn-text">结论</span>
  </button>
  <script>
    // Fallback: if the module bundle has not loaded (or failed), the button
    // still opens the modal so the feature is never a dead click.
    (function () {
      var btn = document.getElementById('insightBtn');
      var modal = document.getElementById('insightModal');
      if (!btn || !modal) return;
      // Give the ES module a chance to bind its own handler first.
      var fallback = function () {
        var body = document.getElementById('insightBody');
        if (!body || body.children.length) return;   // module already rendered
        body.innerHTML = '<div class="ic-loading">正在生成结论…</div>';
        fetch('data/insight.json').then(function (r) { return r.json(); }).then(function (data) {
          modal.classList.add('show');
          document.body.classList.add('modal-open');
          body.innerHTML = '<div class="ic-loading">结论面板已就绪，请刷新页面查看完整内容。</div>';
          var stamp = document.getElementById('insightStamp');
          if (stamp && data.generated_at) {
            stamp.textContent = '数据基准 ' + String(data.generated_at).slice(0, 10);
          }
        }).catch(function () {
          body.innerHTML = '<div class="ic-loading">结论数据加载失败，请稍后重试。</div>';
        });
      };
      // If the module handler already opened the modal, do nothing.
      btn.addEventListener('click', function () {
        setTimeout(function () {
          if (!modal.classList.contains('show')) fallback();
        }, 0);
      });
    })();
  </script>

  <script type="module" src="js/app.js?v=20261111b"></script>
</body>
</html>
